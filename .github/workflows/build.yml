name: 生成我的IPTV订阅源

# ============ 什么时候自动跑 ============
on:
  workflow_dispatch:        # 允许你在网页上手动点按钮运行（第一次就用它）
  schedule:
    - cron: '0 */6 * * *'    # 每天 UTC 21:00（= 北京时间 05:00）自动跑一次；GitHub 可能延迟几分钟
  push:
    paths:
      - 'data/manual.m3u'   # 你自己改了自己的源文件时，也顺手跑一次

# ============ 权限：允许把生成结果提交回仓库 ============
permissions:
  contents: write

concurrency:
  group: iptv-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 取出仓库文件
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 生成订阅文件
        env:
          # ===== 上游源地址：一行一个。想加就加一行，想去掉就删掉那一行 =====
          IPTV_SOURCES: |
            https://ygas.github.io/iptv-sources/txt/ycl_iptv.txt
            https://ghproxy.net/raw.githubusercontent.com/suxuang/myIPTV/main/ipv4.m3u
            https://iptv-org.github.io/iptv/countries/cn.m3u
            https://iptv-org.github.io/iptv/languages/zho.m3u
            # 想要全世界的频道，就把下面这行前面的 # 去掉（文件会很大、播放器加载慢）
            # https://iptv-org.github.io/iptv/index.m3u
          # ===== 想让它先筛掉打不开的源，就改成 'true'（会慢几分钟） =====
          IPTV_PROBE: 'true'
        run: |
          cat > "$RUNNER_TEMP/build.mjs" <<'DSH_SCRIPT'
          #!/usr/bin/env node
          /**
           * 单文件版 IPTV 订阅源生成器（Node 20+，零依赖）
           * 流程：抓取上游列表 → 解析 → 去重 → 分组排序 → 输出 dist/*.m3u / *.txt / report.json
           *
           * 环境变量：
           *   IPTV_SOURCES  上游 m3u/txt 地址，一行一个（可留空）
           *   IPTV_PROBE    'true' 时先做一次存活粗筛（默认 false，省时间）
           */
          import { readFile, writeFile, mkdir } from 'node:fs/promises';
          import { existsSync } from 'node:fs';

          const OUT_DIR = 'dist';
          const MANUAL_FILE = 'data/manual.m3u';
          const PROBE_CONCURRENCY = 100;
          const PROBE_TIMEOUT_MS = 4000;

          const log = (...a) => console.log(...a);

          /* ============================ 1. 抓取 ============================ */
          async function get(url) {
            try {
              const res = await fetch(url, {
                signal: AbortSignal.timeout(20000),
                headers: { 'user-agent': 'iptv-builder/1.0' },
                redirect: 'follow',
              });
              if (!res.ok) { log(`  ✗ ${url} → HTTP ${res.status}`); return ''; }
              const text = await res.text();
              log(`  ✓ ${url} → ${(text.length / 1024).toFixed(1)} KB`);
              return text;
            } catch (e) {
              log(`  ✗ ${url} → ${e.name === 'TimeoutError' ? '超时' : e.message}`);
              return '';
            }
          }

          /* ============================ 2. 解析 ============================ */
          /** 找到 #EXTINF 行里第一个不在引号内的逗号，切出「属性」和「台名」 */
          function splitExtinf(line) {
            let inQuote = false;
            for (let i = 8; i < line.length; i++) {
              const c = line[i];
              if (c === '"') inQuote = !inQuote;
              else if (c === ',' && !inQuote) return [line.slice(0, i), line.slice(i + 1)];
            }
            return [line, ''];
          }

          function parseM3U(text, source) {
            const out = [];
            let pending = null;
            let extgrp = null;
            for (const raw of text.split(/\r?\n/)) {
              const line = raw.trim();
              if (!line) continue;
              if (line.startsWith('#EXTM3U') || line.startsWith('#EXTVLCOPT') || line.startsWith('#KODIPROP')) continue;
              if (line.startsWith('#EXTGRP:')) { extgrp = line.slice(8).trim(); continue; }
              if (line.startsWith('#EXTINF')) {
                const [attrStr, name] = splitExtinf(line);
                const attrs = {};
                for (const m of attrStr.matchAll(/([A-Za-z0-9_-]+)="([^"]*)"/g)) attrs[m[1].toLowerCase()] = m[2];
                pending = {
                  raw: name.trim(),
                  tvgId: attrs['tvg-id'],
                  logo: attrs['tvg-logo'],
                  group: attrs['group-title'] || extgrp || undefined,
                };
                continue;
              }
              if (line.startsWith('#')) continue;
              if (pending) { out.push({ ...pending, url: line, source }); pending = null; }
              else out.push({ raw: '', url: line, source });
            }
            return out;
          }

          function parseTXT(text, source) {
            const out = [];
            let group;
            for (const raw of text.split(/\r?\n/)) {
              const line = raw.trim();
              if (!line || line.startsWith('#')) continue;
              const i = line.indexOf(',');
              if (i < 0) continue;
              const name = line.slice(0, i).trim();
              const rest = line.slice(i + 1).trim();
              if (!rest || /^#genre#$/i.test(rest)) { group = name || undefined; continue; }
              for (const u of rest.split('#')) {
                const url = u.trim();
                if (url) out.push({ raw: name, url, source, group });
              }
            }
            return out;
          }

          const parseAny = (text, source) =>
            /#EXTM3U|#EXTINF/i.test(text) ? parseM3U(text, source) : parseTXT(text, source);

          /* ============================ 3. 清洗去重 ============================ */
          const NOISE = /(\[[^\]]*\])|(【[^】]*】)|(\b(?:FHD|UHD|HEVC|H265|H264|1080P|720P|480P|IPV6|IPV4|HD|SD|4K|8K)\b)|(高清|超清|标清|蓝光|在线直播|测试|备用)/gi;

          function cleanName(raw) {
            let n = String(raw || '').replace(NOISE, ' ').replace(/\s+/g, ' ').replace(/^[\s\-_·.]+|[\s\-_·.]+$/g, '').trim();
            const cctv = n.match(/^cctv[\s\-_]*(\d{1,2}\+?)/i);
            if (cctv) {
              const rest = n.slice(cctv[0].length).trim();
              n = rest ? `CCTV-${cctv[1]} ${rest}` : `CCTV-${cctv[1]}`;
            }
            return n || String(raw || '').trim();
          }

          function normUrl(u) {
            try {
              const x = new URL(String(u).trim());
              x.hash = '';
              x.hostname = x.hostname.toLowerCase();
              return x.toString().replace(/\/+$/, '');
            } catch { return null; }
          }

          const EXCLUDE = ['测试', 'demo', '广告', '福利', '加群', 'Q群', 'VX', '微信', '备用', '付费', '收费'];

          const GROUP_RULES = [
            { re: /^CCTV-?\d|^CGTN|央视/i, group: '央视' },
            { re: /卫视/, group: '卫视' },
            { re: /凤凰|翡翠|明珠|TVB|澳视|澳门|台湾|中天|东森|民视|三立|无线/, group: '港澳台' },
            { re: /新闻|财经|体育|少儿|纪录|影视|音乐|戏曲|法治/, group: '专题' },
            { re: /国际|BBC|CNN|NHK|KBS|Discovery/i, group: '国际' },
          ];
          const GROUP_ORDER = ['央视', '卫视', '港澳台', '专题', '地方', '国际', '其他'];

          /* ============================ 4. 可选：存活粗筛 ============================ */
          async function probeAll(list) {
            const ok = [];
            let i = 0;
            const workers = Array.from({ length: Math.min(PROBE_CONCURRENCY, list.length) }, async () => {
              while (i < list.length) {
                const ch = list[i++];
                try {
                  const res = await fetch(ch.url, {
                    signal: AbortSignal.timeout(PROBE_TIMEOUT_MS),
                    headers: { range: 'bytes=0-1023', 'user-agent': 'VLC/3.0.20' },
                    redirect: 'follow',
                  });
                  if (res.status < 400) ok.push(ch);
                  try { await res.body?.cancel(); } catch { /* ignore */ }
                } catch { /* 探测失败就当它不可用 */ }
              }
            });
            await Promise.all(workers);
            return ok;
          }

          /* ============================ 主流程 ============================ */
          const main = async () => {
            const sources = (process.env.IPTV_SOURCES || '')
              .split(/\r?\n/).map((s) => s.trim()).filter((s) => s && !s.startsWith('#'));
            const doProbe = String(process.env.IPTV_PROBE || '').toLowerCase() === 'true';

            log(`【1/4】抓取上游列表（${sources.length} 个）`);
            const chunks = [];
            for (const url of sources) chunks.push({ name: url, text: await get(url) });

            if (existsSync(MANUAL_FILE)) {
              const text = await readFile(MANUAL_FILE, 'utf8');
              log(`  ✓ ${MANUAL_FILE}（你自己的源）→ ${(text.length / 1024).toFixed(1)} KB`);
              chunks.unshift({ name: 'manual', text });
            } else {
              log(`  · 没有 ${MANUAL_FILE}（可选，想加自己的源就建这个文件）`);
            }

            log('【2/4】解析');
            let entries = [];
            for (const c of chunks) if (c.text) entries.push(...parseAny(c.text, c.name));
            log(`  原始条目 ${entries.length} 条`);

            log('【3/4】去重 + 分组');
            const byUrl = new Map();
            for (const ch of entries) {
              const url = normUrl(ch.url);
              if (!url) continue;
              const name = cleanName(ch.raw);
              if (!name) continue;
              if (EXCLUDE.some((k) => (ch.raw || '').toLowerCase().includes(k.toLowerCase()))) continue;
              if (byUrl.has(url)) { byUrl.get(url).seen++; continue; }
              byUrl.set(url, { ...ch, url, name, seen: 1 });
            }
            let list = [...byUrl.values()];
            log(`  去重后 ${list.length} 条`);

            if (doProbe && list.length) {
              log(`【3.5/4】存活粗筛（并发 ${PROBE_CONCURRENCY}，超时 ${PROBE_TIMEOUT_MS}ms，可能要几分钟）`);
              const alive = await probeAll(list);
              log(`  通过 ${alive.length} / ${list.length}`);
              if (alive.length >= Math.max(10, list.length * 0.05)) list = alive;
              else log('  ⚠️ 通过率过低，可能是运行环境网络受限，改用全量列表输出');
            }

            for (const ch of list) {
              const key = `${ch.name} ${ch.group || ''}`;
              ch.group = (GROUP_RULES.find((r) => r.re.test(key)) || {}).group || '其他';
              ch.score = (ch.source === 'manual' ? 100 : 0) + (/^https:/i.test(ch.url) ? 5 : 0) + Math.min(10, ch.seen * 2);
            }
            list.sort((a, b) => {
              const da = GROUP_ORDER.indexOf(a.group), db = GROUP_ORDER.indexOf(b.group);
              return (da < 0 ? 99 : da) - (db < 0 ? 99 : db) || b.score - a.score || a.name.localeCompare(b.name, 'zh-Hans-CN');
            });

            log('【4/4】输出');
            await mkdir(OUT_DIR, { recursive: true });
            const stamp = new Date().toISOString().replace(/\.\d+Z$/, 'Z');
            const head = [
              '#EXTM3U',
              '#EXTENC:UTF-8',
              `# 生成时间 build: ${stamp}  频道数 channels: ${list.length}`,
              '# 仅汇总公开可获取的直播地址，不存储、不转码任何内容；版权归各电视台所有。',
            ].join('\n');
            const body = list.map((c) => {
              const attrs = [
                c.tvgId ? `tvg-id="${c.tvgId}"` : '',
                `tvg-name="${c.name}"`,
                c.logo ? `tvg-logo="${c.logo}"` : '',
                `group-title="${c.group}"`,
              ].filter(Boolean).join(' ');
              return `#EXTINF:-1 ${attrs},${c.name}\n${c.url}`;
            }).join('\n');
            await writeFile(`${OUT_DIR}/all.m3u`, `${head}\n${body}\n`, 'utf8');

            const lines = [];
            let g = null;
            for (const c of list) {
              if (c.group !== g) { g = c.group; lines.push(`${g},#genre#`); }
              lines.push(`${c.name},${c.url}`);
            }
            await writeFile(`${OUT_DIR}/all.txt`, `${lines.join('\n')}\n`, 'utf8');

            const groups = {};
            for (const c of list) groups[c.group] = (groups[c.group] || 0) + 1;
            await writeFile(`${OUT_DIR}/report.json`, JSON.stringify({
              builtAt: stamp, sources: sources.length, total: entries.length, output: list.length, groups,
              sample: list.slice(0, 10).map((c) => `${c.group} | ${c.name}`),
            }, null, 2), 'utf8');

            log(`✅ 完成：${OUT_DIR}/all.m3u（${list.length} 个频道）  ${OUT_DIR}/all.txt  ${OUT_DIR}/report.json`);
            log(`   分组统计：${JSON.stringify(groups)}`);
            if (!list.length) { log('❌ 一个频道都没有：检查上面的抓取是否全是 ✗（网络问题或源地址失效）'); process.exit(1); }
          };

          main().catch((e) => { console.error('❌ 运行失败：', e); process.exit(1); });
          DSH_SCRIPT
          node "$RUNNER_TEMP/build.mjs"

      - name: 提交结果
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist
          if git diff --staged --quiet; then
            echo "结果没有变化，跳过提交"
            exit 0
          fi
          git commit -m "更新订阅源 $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
